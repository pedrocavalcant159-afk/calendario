<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Atualizar andamento | Calendário UPLI</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; background: #f3f4f6; color: #111827; font-family: Arial, sans-serif; padding: 20px; }
    main { width: min(620px, 100%); margin: 24px auto; background: #fff; border: 1px solid #d1d5db; box-shadow: 0 12px 30px rgba(0,0,0,.12); }
    header { background: #111827; color: #fff; padding: 22px; }
    header p { margin: 0; color: #6ee7b7; font-size: 12px; font-weight: 700; }
    h1 { margin: 5px 0 0; font-size: 23px; }
    .content { padding: 22px; }
    .greeting { margin: 0 0 18px; font-size: 18px; }
    .demand { border-bottom: 1px solid #e5e7eb; padding-bottom: 17px; margin-bottom: 20px; }
    .demand h2 { margin: 0; font-size: 20px; overflow-wrap: anywhere; }
    .demand p { margin: 7px 0 0; color: #4b5563; font-size: 14px; }
    fieldset { margin: 0; padding: 0; border: 0; }
    legend, label.title { display: block; font-weight: 700; margin-bottom: 10px; }
    .statuses { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 9px; }
    .status { display: flex; gap: 10px; align-items: center; border: 2px solid #e5e7eb; padding: 12px; cursor: pointer; }
    .status:has(input:checked) { border-color: #111827; background: #f9fafb; }
    .swatch { width: 13px; height: 13px; flex: 0 0 auto; }
    textarea { width: 100%; min-height: 92px; resize: vertical; border: 2px solid #d1d5db; padding: 12px; font: inherit; }
    button { width: 100%; margin-top: 18px; border: 0; background: #047857; color: #fff; padding: 14px; font-weight: 700; font-size: 16px; cursor: pointer; }
    button:disabled { background: #9ca3af; cursor: wait; }
    .message { display: none; border: 1px solid; padding: 14px; margin-bottom: 18px; font-weight: 700; }
    .message.error { display: block; border-color: #fca5a5; background: #fef2f2; color: #991b1b; }
    .message.success { display: block; border-color: #6ee7b7; background: #ecfdf5; color: #065f46; }
    footer { margin-top: 20px; padding-top: 15px; border-top: 1px solid #e5e7eb; color: #6b7280; font-size: 12px; }
    @media (max-width: 520px) { body { padding: 0; } main { margin: 0; min-height: 100vh; border: 0; } .statuses { grid-template-columns: 1fr; } }
  </style>
</head>
<body data-token="{{TOKEN}}">
  <main>
    <header>
      <p>CALENDÁRIO UPLI</p>
      <h1>Atualizar andamento</h1>
    </header>
    <div class="content">
      <p class="greeting">Olá, <strong>{{RESPONSIBLE_NAME}}</strong>.</p>
      <div id="message" class="message" role="status"></div>
      <form id="update-form">
        <section class="demand">
          <h2>{{EVENT_TITLE}}</h2>
          <p>{{COMPANY_NAME}} · {{EVENT_DATE}}</p>
        </section>
        <fieldset>
          <legend>Como está o andamento?</legend>
          <div class="statuses">{{STATUS_OPTIONS}}</div>
        </fieldset>
        <label class="title" for="note" style="margin-top:20px">Observação <span style="font-weight:400;color:#6b7280">(opcional)</span></label>
        <textarea id="note" maxlength="500" placeholder="Ex.: material enviado para aprovação"></textarea>
        <button id="submit-button" type="submit">Confirmar andamento</button>
      </form>
      <footer>Link pessoal válido até {{EXPIRES_AT}}. Não encaminhe esta mensagem.</footer>
    </div>
  </main>
  <script>
    (function () {
      "use strict";
      var form = document.getElementById("update-form");
      var button = document.getElementById("submit-button");
      var message = document.getElementById("message");
      var token = document.body.getAttribute("data-token");
      form.addEventListener("submit", async function (event) {
        event.preventDefault();
        var selected = form.querySelector('input[name="status"]:checked');
        if (!selected) return;
        button.disabled = true;
        button.textContent = "Atualizando...";
        message.className = "message";
        try {
          var response = await fetch(window.location.pathname, {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({
              action: "update",
              token: token,
              status: selected.value,
              note: document.getElementById("note").value
            })
          });
          var result = await response.json();
          if (!response.ok || !result.ok) throw new Error(result.error || "Não foi possível atualizar.");
          form.style.display = "none";
          message.textContent = "Andamento atualizado para " + result.label + ". A alteração já aparece no calendário.";
          message.className = "message success";
        } catch (error) {
          message.textContent = error.message || "Não foi possível atualizar o andamento.";
          message.className = "message error";
          button.disabled = false;
          button.textContent = "Confirmar andamento";
        }
      });
    }());
  </script>
</body>
</html>
