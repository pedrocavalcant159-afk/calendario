    <title>Criador de Calendário de Conteúdo - UPLI</title>
    
    <script>
        window.addEventListener('error', function(event) {
            document.body.style.background = '#f7f9fb';
            document.body.innerHTML = '<div class="critical-error" style="max-width:760px; background:#fffafa; padding:32px; margin:8vh auto; border:1px solid #b94b4b; border-top:6px solid #8d2929; font-family:Atkinson Hyperlegible,Segoe UI,sans-serif; color:#7d2626; box-shadow:14px 14px 0 rgba(125,38,38,.12);">' +
                '<p style="margin:0 0 8px; font-size:11px; font-weight:700; letter-spacing:.16em; text-transform:uppercase;">Falha de sistema</p>' +
                '<h2 style="margin:0; font-size:28px; color:#421919;">Não foi possível abrir a interface</h2>' +
                '<p style="font-size:16px;"><strong>Detalhe:</strong> ' + event.message + '</p>' +
                '<p style="font-size: 16px;"><strong>Linha:</strong> ' + event.lineno + ' | <strong>Coluna:</strong> ' + event.colno + '</p>' +
                '<p style="margin-top: 10px; font-weight: bold;">Detalhes Técnicos (Envie para o chat):</p>' +
                '<pre style="background:#fff; padding:15px; border:1px solid #d9a1a1; overflow:auto; font-size:13px;">' + (event.error && event.error.stack ? event.error.stack : 'Sem detalhes extras.') + '</pre>' +
                '</div>';
        });

        window.alert = function(message) {
            const previous = document.querySelector('.system-notice-overlay');
            if (previous) previous.remove();
            const overlay = document.createElement('div');
            overlay.className = 'system-notice-overlay';
            overlay.setAttribute('role', 'dialog');
            overlay.setAttribute('aria-modal', 'true');
            overlay.setAttribute('aria-label', 'Aviso do sistema');
            const panel = document.createElement('section');
            panel.className = 'system-notice-panel';
            const eyebrow = document.createElement('p');
            eyebrow.className = 'system-notice-eyebrow';
            eyebrow.textContent = 'Aviso do sistema';
            const title = document.createElement('h2');
            title.textContent = /erro|inválid|falha|não foi possível/i.test(String(message)) ? 'Algo precisa de atenção' : 'Calendário UPLI';
            const body = document.createElement('p');
            body.className = 'system-notice-message';
            body.textContent = String(message || 'Operação concluída.');
            const close = document.createElement('button');
            close.type = 'button';
            close.textContent = 'Entendi';
            const dismiss = () => {
                overlay.remove();
                document.removeEventListener('keydown', onKey);
            };
            close.addEventListener('click', dismiss);
            overlay.addEventListener('click', event => { if (event.target === overlay) dismiss(); });
            const onKey = event => {
                if (event.key === 'Escape') {
                    dismiss();
                }
            };
            document.addEventListener('keydown', onKey);
            panel.append(eyebrow, title, body, close);
            overlay.append(panel);
            document.body.append(overlay);
            close.focus();
        };
    </script>

<body class="bg-gray-100 transition-colors duration-300">

    <script type="text/babel">
        class ErrorBoundary extends React.Component {
            constructor(props) { super(props); this.state = { hasError: false, errorMsg: '' }; }
            static getDerivedStateFromError(error) { return { hasError: true, errorMsg: error.toString() }; }
            render() {
                if (this.state.hasError) {
                    return (

                                <pre className="bg-gray-100 p-4 rounded text-sm text-red-800 overflow-auto">{this.state.errorMsg}</pre>
                                <button onClick={() => window.location.reload()} className="mt-6 bg-red-600 text-white px-6 py-2 rounded font-bold">Recarregar Página</button>
                            </div>
                        </div>
                    );
                }
                return this.props.children;
            }
        }

        const firebaseConfig = {
          apiKey: "AIzaSyAEJFGMGIOy2z9oeX9PQWHA0HYJbIytlg8",
          authDomain: "calendario-upli.firebaseapp.com",
          projectId: "calendario-upli",
          messagingSenderId: "849051732172",
          appId: "1:849051732172:web:14735da6c16d19bcf71a69",
          measurementId: "G-6YXY6KY98T"
        };

        if (!firebase.apps.length) {
            firebase.initializeApp(firebaseConfig);
        }
        const auth = firebase.auth();
        const db = firebase.firestore();
        const reminderFirebaseApp = firebase.apps.find(app => app.name === 'ReminderPublic') ||
            firebase.initializeApp(firebaseConfig, 'ReminderPublic');
        const reminderPublicDb = reminderFirebaseApp.firestore();

        const { useState, useEffect } = React;
        
        const Download = () => <span className="tool-icon" aria-hidden="true">↓</span>;
        const Upload = () => <span className="tool-icon" aria-hidden="true">↑</span>;
        const Trash2 = () => <span className="tool-icon" aria-hidden="true">×</span>;
        const CalendarDays = () => <span className="tool-icon tool-date" aria-hidden="true">31</span>;
        const Edit2 = () => <span className="tool-icon" aria-hidden="true">↗</span>;
        const LogOut = () => <span className="tool-icon" aria-hidden="true">→</span>;
        const DatabaseIcon = () => <span className="tool-icon" aria-hidden="true">●</span>;
        const MessageSquare = () => <span className="tool-icon" aria-hidden="true">•••</span>;

        const PDFIcon = () => <span className="tool-icon tool-icon-box" aria-hidden="true">PDF</span>;
        const KeyIcon = () => <span className="tool-icon tool-icon-box" aria-hidden="true">KEY</span>;
        const CheckIcon = () => <span className="tool-icon" aria-hidden="true">✓</span>;
        const MultiSelectIcon = () => <span className="tool-icon" aria-hidden="true">□</span>;
        const TrelloIcon = () => <span className="tool-icon tool-icon-box" title="Trello" aria-hidden="true">TR</span>;
        
        const MEU_EMAIL_MASTER = "pedrocavalcant159@gmail.com".toLowerCase();
        
        // 🔥 A GRANDE SACADA: Mudamos o ID do banco de dados para despistar o bug.
        const UPLI_GERAL_ID = "upli_geral_v2";
        const REQUIRED_AUTOMATION_AGENT_VERSION = 6;

        const STANDARD_CATEGORIES = [
            { id: 'cat_reels', label: 'Reels', color: '#E1306C' },
            { id: 'cat_fotos', label: 'Fotos', color: '#1DA1F2' },
            { id: 'cat_stories', label: 'Stories', color: '#F56040' },
            { id: 'cat_design', label: 'Design', color: '#405DE6' },
            { id: 'cat_evento', label: 'Evento', color: '#FFDC80' }
        ];

        const DEFAULT_STATUS_PIPELINE = {
            'criacao': { label: 'Criação', bg: '#3B82F6', text: '#FFFFFF' }, 
            'gravacao': { label: 'Gravação', bg: '#8B5CF6', text: '#FFFFFF' }, 
            'producao': { label: 'Produção', bg: '#F59E0B', text: '#FFFFFF' }, 
            'aprovacao': { label: 'Aprovação', bg: '#06B6D4', text: '#FFFFFF' }, 
            'aprovado': { label: 'Aprovado', bg: '#84CC16', text: '#FFFFFF' }, 
            'atrasado': { label: 'Atrasado', bg: '#EF4444', text: '#FFFFFF' }, 
            'concluido': { label: 'Concluído', bg: '#16A34A', text: '#FFFFFF' },
            'publicado': { label: 'Publicado', bg: '#10B981', text: '#FFFFFF' } 
        };

        const isTerminalEventStatus = status => ['concluido', 'publicado'].includes(String(status || '').trim().toLowerCase());

        const stringToColor = (str) => {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = str.charCodeAt(i) + ((hash << 5) - hash);
            let color = '#';
            for (let i = 0; i < 3; i++) {
                const value = (hash >> (i * 8)) & 0xFF;
                color += ('00' + value.toString(16)).substr(-2);
            }
            return color;
        };

        const handleHexChange = (value, setter) => {
            let val = value.replace(/[^a-fA-F0-9#]/g, ''); 
            if (!val.startsWith('#')) val = '#' + val.replace(/#/g, ''); 
            setter(val.substring(0, 7));
        };

        const getCleanDisplayText = (text, isCentral, compLabel) => {
            let cleanText = text || '';
            if (isCentral) {
                if (compLabel) {
                    const prefix1 = compLabel.toLowerCase() + ':';
                    const prefix2 = compLabel.toLowerCase() + ' :';
                    if (cleanText.toLowerCase().startsWith(prefix1)) {
                        cleanText = cleanText.substring(prefix1.length).trim();
                    } else if (cleanText.toLowerCase().startsWith(prefix2)) {
                        cleanText = cleanText.substring(prefix2.length).trim();
                    }
                }
                return cleanText;
            } else {
                if (compLabel) {
                    const catPrefix = compLabel.toLowerCase() + ':';
                    if (!cleanText.toLowerCase().startsWith(catPrefix)) {
                        cleanText = `${compLabel}: ${cleanText}`;
                    }
                }
                return cleanText;
            }
        };

        const eventIdMatches = (storedId, requestedId) => {
            const stored = String(storedId || '');
            const requested = String(requestedId || '');
            return stored === requested || stored === `${requested}_clone` || `${stored}_clone` === requested;
        };

        const PostStatusUpdate = () => {
          const params = new URLSearchParams(window.location.search);
          const companyId = params.get('updateCompany') || '';
          const eventId = params.get('updateEvent') || '';
          const [user, setUser] = useState(null);
          const [loadingAuth, setLoadingAuth] = useState(true);
          const [email, setEmail] = useState('');
          const [password, setPassword] = useState('');
          const [loginError, setLoginError] = useState('');
          const [eventData, setEventData] = useState(null);
          const [companyName, setCompanyName] = useState('');
          const [pipeline, setPipeline] = useState(DEFAULT_STATUS_PIPELINE);
          const [selectedStatus, setSelectedStatus] = useState('');
          const [updateNote, setUpdateNote] = useState('');
          const [loadingPost, setLoadingPost] = useState(false);
          const [saving, setSaving] = useState(false);
          const [error, setError] = useState('');
          const [success, setSuccess] = useState(false);

          useEffect(() => auth.onAuthStateChanged(currentUser => {
              setUser(currentUser);
              setLoadingAuth(false);
          }), []);

          useEffect(() => {
              if (!user || !companyId || !eventId) return;
              let cancelled = false;
              const loadPost = async () => {
                  setLoadingPost(true);
                  setError('');
                  try {
                      const [companyDoc, rolesDoc, centralDoc, teamDoc] = await Promise.all([
                          db.collection('companies').doc(companyId).get(),
                          db.collection('system').doc('roles').get(),
                          db.collection('companies').doc(UPLI_GERAL_ID).get(),
                          db.collection('system').doc('team').get()
                      ]);
                      if (!companyDoc.exists) throw new Error('Este calendário não existe mais.');
                      const company = companyDoc.data() || {};
                      const found = (company.events || []).find(item => eventIdMatches(item.id, eventId));
                      if (!found) throw new Error('Este post foi removido ou o link não é mais válido.');

                      const emailKey = String(user.email || '').toLowerCase();
                      const roles = rolesDoc.exists ? (rolesDoc.data() || {}) : {};
                      const role = (roles.userRoles || {})[emailKey];
                      const assignedCompany = (roles.userCompanies || {})[emailKey];
                      const team = teamDoc.exists ? (teamDoc.data() || {}) : {};
                      const responsibleMember = (team.members || []).find(member => member.id === found.responsibleId);
                      const responsibleEmail = String(
                          responsibleMember?.email || found.responsibleEmail || found.responsible || ''
                      ).trim().toLowerCase();
                      const allowed = emailKey === MEU_EMAIL_MASTER || role === 'master' || role === 'admin' ||
                          assignedCompany === companyId || responsibleEmail === emailKey;
                      if (!allowed) throw new Error('Sua conta não tem permissão para atualizar este post.');

                      if (cancelled) return;
                      const central = centralDoc.exists ? (centralDoc.data() || {}) : {};
                      setPipeline({ ...DEFAULT_STATUS_PIPELINE, ...(central.statusPipeline || {}) });
                      setCompanyName(company.name || 'Calendário UPLI');
                      setEventData(found);
                      setSelectedStatus(found.status || 'criacao');
                  } catch (loadError) {
                      if (!cancelled) setError(loadError.message || 'Não foi possível carregar o post.');
                  } finally {
                      if (!cancelled) setLoadingPost(false);
                  }
              };
              loadPost();
              return () => { cancelled = true; };
          }, [user, companyId, eventId]);

          const handleLogin = async (submitEvent) => {
              submitEvent.preventDefault();
              setLoginError('');
              try {
                  await auth.signInWithEmailAndPassword(email.trim(), password);
              } catch (loginFailure) {
                  setLoginError('Não foi possível entrar. Confira o e-mail e a senha.');
              }
          };

          const submitStatusUpdate = async (submitEvent) => {
              submitEvent.preventDefault();
              if (!selectedStatus || !eventData || !user) return;
              setSaving(true);
              setError('');
              try {
                  const sourceRef = db.collection('companies').doc(companyId);
                  const centralRef = db.collection('companies').doc(UPLI_GERAL_ID);
                  const updatedAt = new Date().toISOString();
                  const historyEntry = {
                      from: eventData.status || null,
                      to: selectedStatus,
                      note: updateNote.trim(),
                      updatedAt,
                      updatedBy: user.displayName || user.email || 'Usuário',
                      updatedByEmail: user.email || '',
                      source: 'whatsapp-reminder-link'
                  };

                  await db.runTransaction(async transaction => {
                      const sourceDoc = await transaction.get(sourceRef);
                      if (!sourceDoc.exists) throw new Error('O calendário foi removido.');
                      const sourceData = sourceDoc.data() || {};
                      const sourceEvents = [...(sourceData.events || [])];
                      const sourceIndex = sourceEvents.findIndex(item => eventIdMatches(item.id, eventId));
                      if (sourceIndex === -1) throw new Error('O post foi removido antes da atualização.');

                      let centralDoc = null;
                      if (companyId !== UPLI_GERAL_ID) centralDoc = await transaction.get(centralRef);

                      const current = sourceEvents[sourceIndex];
                      const currentHistoryEntry = { ...historyEntry, from: current.status || null };
                      sourceEvents[sourceIndex] = {
                          ...current,
                          status: selectedStatus,
                          statusUpdateNote: updateNote.trim(),
                          statusHistory: [...(current.statusHistory || []), currentHistoryEntry].slice(-20),
                          updatedAt,
                          updatedBy: historyEntry.updatedBy,
                          updatedByEmail: historyEntry.updatedByEmail
                      };
                      transaction.update(sourceRef, { events: sourceEvents });

                      if (centralDoc && centralDoc.exists) {
                          const centralData = centralDoc.data() || {};
                          const centralEvents = [...(centralData.events || [])];
                          const centralIndex = centralEvents.findIndex(item => eventIdMatches(item.id, eventId));
                          if (centralIndex !== -1) {
                              centralEvents[centralIndex] = {
                                  ...centralEvents[centralIndex],
                                  status: selectedStatus,
                                  statusUpdateNote: updateNote.trim(),
                                  statusHistory: [...(centralEvents[centralIndex].statusHistory || []), currentHistoryEntry].slice(-20),
                                  updatedAt,
                                  updatedBy: historyEntry.updatedBy,
                                  updatedByEmail: historyEntry.updatedByEmail
                              };
                              transaction.update(centralRef, { events: centralEvents });
                          }
                      }
                  });
                  setEventData(current => ({ ...current, status: selectedStatus, statusUpdateNote: updateNote.trim(), updatedAt }));
                  setSuccess(true);
              } catch (saveError) {
                  setError(saveError.message || 'Não foi possível atualizar o andamento.');
              } finally {
                  setSaving(false);
              }
          };

          if (!companyId || !eventId) {
              return <main className="system-page min-h-screen flex items-center justify-center p-5"><section className="system-panel p-6"><p className="precision-eyebrow">Falha de acesso</p><h1 className="text-xl font-bold mt-2">Link inválido</h1><p className="mt-2 text-gray-600">O endereço do post está incompleto.</p></section></main>;
          }
          if (loadingAuth) return <main className="system-loading"><span className="system-loading-mark">Validando acesso</span></main>;
          if (!user) {
              return (
                  <main className="system-page min-h-screen flex items-center justify-center p-5">
                      <form onSubmit={handleLogin} className="system-panel p-6">
                          <p className="precision-eyebrow">CALENDÁRIO UPLI</p>
                          <h1 className="text-2xl font-bold mt-1">Atualizar andamento</h1>
                          <p className="text-gray-600 mt-2">Entre com sua conta do calendário para responder ao lembrete.</p>
                          <label className="block text-sm font-bold mt-5">E-mail</label>
                          <input type="email" required value={email} onChange={e => setEmail(e.target.value)} className="mt-1 w-full border-2 border-gray-300 rounded-md px-3 py-3" autoComplete="username" />
                          <label className="block text-sm font-bold mt-4">Senha</label>
                          <input type="password" required value={password} onChange={e => setPassword(e.target.value)} className="mt-1 w-full border-2 border-gray-300 rounded-md px-3 py-3" autoComplete="current-password" />
                          {loginError && <p className="system-alert system-alert-error mt-3 font-bold">{loginError}</p>}
                          <button type="submit" className="system-primary-action mt-5 w-full px-4 py-3 font-bold">Entrar e continuar</button>
                      </form>
                  </main>
              );
          }
          return (
              <main className="system-page min-h-screen p-4 sm:p-8">
                  <section className="system-panel mx-auto">
                      <header className="bg-gray-900 text-white p-5">
                          <p className="text-xs font-bold text-emerald-400">CALENDÁRIO UPLI</p>
                          <h1 className="text-xl font-bold mt-1">Atualizar andamento do post</h1>
                      </header>
                      <div className="system-panel-content">
                          {loadingPost && <p className="text-gray-600">Carregando post...</p>}
                          {error && <p className="system-alert system-alert-error font-semibold">{error}</p>}
                          {success && <div className="system-alert system-alert-success"><strong>Andamento atualizado.</strong><p className="text-sm mt-1">O novo status já aparece no calendário.</p></div>}
                          {eventData && !success && (
                              <form onSubmit={submitStatusUpdate}>
                                  <div className="border-b border-gray-200 pb-4 mb-5">
                                      <h2 className="text-lg font-bold break-words">{eventData.text || 'Post sem título'}</h2>
                                      <p className="text-sm text-gray-600 mt-1">{companyName} · {String(eventData.day).padStart(2, '0')}/{String(Number(eventData.month) + 1).padStart(2, '0')}/{eventData.year}</p>
                                      <p className="text-sm text-gray-600 mt-1">Responsável: {eventData.responsible || 'Não definido'}</p>
                                  </div>
                                  <fieldset>
                                      <legend className="font-bold mb-3">Como está o andamento?</legend>
                                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                          {Object.entries(pipeline).map(([key, value]) => (
                                              <label key={key} className={`flex items-center gap-3 border-2 rounded-md p-3 cursor-pointer ${selectedStatus === key ? 'border-gray-900 bg-gray-50' : 'border-gray-200'}`}>
                                                  <input type="radio" name="status" value={key} checked={selectedStatus === key} onChange={() => setSelectedStatus(key)} />
                                                  <span className="w-3 h-3 rounded-sm shrink-0" style={{backgroundColor: value.bg}}></span>
                                                  <span className="font-semibold">{value.label}</span>
                                              </label>
                                          ))}
                                      </div>
                                  </fieldset>
                                  <label className="block font-bold mt-5">Observação <span className="font-normal text-gray-500">(opcional)</span></label>
                                  <textarea value={updateNote} onChange={e => setUpdateNote(e.target.value)} rows="3" maxLength="500" className="mt-2 w-full border-2 border-gray-300 rounded-md px-3 py-3" placeholder="Ex.: material enviado para aprovação"></textarea>
                                  <button type="submit" disabled={saving} className="system-primary-action mt-5 w-full px-4 py-3 font-bold disabled:opacity-50">{saving ? 'Atualizando...' : 'Confirmar andamento'}</button>
                              </form>
                          )}
                          <div className="mt-5 pt-4 border-t border-gray-200 flex items-center justify-between gap-3 text-xs text-gray-500">
                              <span className="break-all">{user.email}</span>
                              <button type="button" onClick={() => auth.signOut()} className="font-bold text-gray-700">Sair</button>
                          </div>

          useEffect(() => {
              let cancelled = false;
              const loadRequest = async () => {
                  if (!/^[A-Za-z0-9_-]{40,80}$/.test(token)) {
                      setError('Este link de atualização é inválido.');
                      setLoading(false);
                      return;
                  }
                  try {
                      const snapshot = await reminderPublicDb.collection('reminderRequests').doc(token).get();
                      if (!snapshot.exists) throw new Error('Este link não existe ou já foi removido.');
                      const data = snapshot.data() || {};
                      const expiresAt = data.expiresAt?.toDate ? data.expiresAt.toDate() : null;
                      if (data.processed === true) {
                          setSuccess('Esta resposta já foi processada e o calendário foi atualizado.');
                      } else if (data.responseVersion > 0) {
                          setSuccess('Resposta recebida. O calendário será atualizado automaticamente.');
                      } else if (data.active !== true || !expiresAt || expiresAt.getTime() <= Date.now()) {
                          throw new Error('Este link expirou. Peça um novo lembrete à equipe UPLI.');
                      } else if (!Array.isArray(data.statusOptions) || !data.statusOptions.length) {
                          throw new Error('Este formulário está sem opções de andamento.');
                      } else {
                          setRequestData(data);
                          const validCurrent = data.statusOptions.some(option => option.key === data.currentStatus);
                          setSelectedStatus(validCurrent ? data.currentStatus : data.statusOptions[0].key);
                      }
                  } catch (loadError) {
                      if (!cancelled) setError(loadError.message || 'Não foi possível abrir este formulário.');
                  } finally {
                      if (!cancelled) setLoading(false);
                  }
              };
              loadRequest();
              return () => { cancelled = true; };
          }, [token]);

          const submitResponse = async submitEvent => {
              submitEvent.preventDefault();
              if (!requestData || !selectedStatus || saving) return;
              setSaving(true);
              setError('');
              try {
                  await reminderPublicDb.collection('reminderRequests').doc(token).update({
                      responseStatus: selectedStatus,
                      responseNote: updateNote.trim(),
                      respondedAt: firebase.firestore.FieldValue.serverTimestamp(),
                      responseVersion: 1
                  });
                  setRequestData(null);
                  setSuccess('Resposta recebida. O calendário será atualizado automaticamente.');
              } catch (saveError) {
                  setError(
                      saveError?.code === 'permission-denied'
                          ? 'Este link expirou ou já recebeu uma resposta.'
                          : 'Não foi possível enviar agora. Verifique sua internet e tente novamente.'
                  );
              } finally {
                  setSaving(false);
              }
          };

                      <header className="bg-gray-900 text-white p-5">

                      </header>

                          {error && <p className="system-alert system-alert-error font-semibold">{error}</p>}
                          {success && <div className="system-alert system-alert-success"><strong>{success}</strong></div>}
                          {requestData && !success && (
                              <form onSubmit={submitResponse}>
                                  <div className="border-b border-gray-200 pb-4 mb-5">
                                      <p className="text-sm font-bold text-emerald-700">{requestData.responsibleName}</p>
                                      <h2 className="text-lg font-bold break-words mt-1">{requestData.title || 'Post sem título'}</h2>
                                      <p className="text-sm text-gray-600 mt-1">{requestData.companyName} · {requestData.dueDateLabel}</p>
                                  </div>
                                  <fieldset>
                                      <legend className="font-bold mb-3">Como está o andamento?</legend>
                                      <div className="grid grid-cols-1 sm:grid-cols-2 gap-2">
                                          {requestData.statusOptions.map(option => (
                                              <label key={option.key} className={'flex items-center gap-3 border-2 rounded-md p-3 cursor-pointer ' + (selectedStatus === option.key ? 'border-gray-900 bg-gray-50' : 'border-gray-200')}>
                                                  <input type="radio" name="status" value={option.key} checked={selectedStatus === option.key} onChange={() => setSelectedStatus(option.key)} />
                                                  <span className="w-3 h-3 rounded-sm shrink-0" style={{backgroundColor: option.color || '#64748B'}}></span>
                                                  <span className="font-semibold">{option.label}</span>
                                              </label>
                                          ))}
                                      </div>
                                  </fieldset>
                                  <label className="block font-bold mt-5">Observação <span className="font-normal text-gray-500">(opcional)</span></label>
                                  <textarea value={updateNote} onChange={event => setUpdateNote(event.target.value)} rows="3" maxLength="500" className="mt-2 w-full border-2 border-gray-300 rounded-md px-3 py-3" placeholder="Ex.: material enviado para aprovação"></textarea>
                                  <button type="submit" disabled={saving} className="system-primary-action mt-5 w-full px-4 py-3 font-bold disabled:opacity-50">{saving ? 'Enviando...' : 'Confirmar andamento'}</button>
                              </form>
                          )}
                      </div>
                  </section>
              </main>
          );

                            upliEvents[linkedIdx] = {
                                ...upliEvents[linkedIdx],
                                day: updatedEvt.day,
                                text: newText,
                                startTime: updatedEvt.startTime || '',
                                endTime: updatedEvt.endTime || '',
                                notes: updatedEvt.notes,
                                imageUrl: updatedEvt.imageUrl,
                                responsibleId: updatedEvt.responsibleId,
                                responsible: updatedEvt.responsible,
                                responsiblePhone: updatedEvt.responsiblePhone,
                                responsibleEmail: updatedEvt.responsibleEmail
                            };
                            db.collection('companies').doc(UPLI_GERAL_ID).set({ events: upliEvents }, { merge: true });
                        }
                    }
                }
            }
            setEditingEventIndex(null);
          };

          const cancelEditEvent = () => setEditingEventIndex(null);

          const onDragStart = (e, originalIndex) => { 
              if (isSelectionMode) { e.preventDefault(); return; } 
              e.dataTransfer.setData("eventIndex", originalIndex); 
          };
          const onDragOver = (e) => { if (!isSelectionMode) e.preventDefault(); };

          const onDrop = (e, targetDay) => {
              if (isSelectionMode) return;
              e.preventDefault();
              if(!isAdmin) return; 
              const originalIndex = e.dataTransfer.getData("eventIndex");
              if(originalIndex === null || originalIndex === '') return;
              
              const updatedEvents = [...events];
              updatedEvents[originalIndex].day = targetDay;
              updatedEvents[originalIndex].updatedBy = currentUserName;
              updatedEvents[originalIndex].updatedAt = new Date().toISOString();
              saveToCloud({ events: updatedEvents });

              if (selectedCompany !== UPLI_GERAL_ID) {
                  const upliGeral = companies.find(c => c.id === UPLI_GERAL_ID);
                  if (upliGeral) {
                      const upliEvents = [...upliGeral.events];
                      const linkedIdx = upliEvents.findIndex(evt => evt.id === updatedEvents[originalIndex].id || evt.id === updatedEvents[originalIndex].id + "_clone");
                      if (linkedIdx !== -1) {
                          upliEvents[linkedIdx].day = targetDay;
                          db.collection('companies').doc(UPLI_GERAL_ID).set({ events: upliEvents }, { merge: true });
                      }
                  }
              }
          };

          const addCategory = () => {
            if (newCategory.label.trim()) {
              const updatedCats = [...colorOptions, { id: Date.now().toString(), label: newCategory.label, color: newCategory.color }];
              saveToCloud({ categories: updatedCats });
              setNewCategory({ label: '', color: '#3b82f6' });
            }
          };
          const removeCategory = (id) => {
            const updatedCats = colorOptions.filter(c => c.id !== id);
            const updatedEvts = events.filter(e => e.color !== id);
            saveToCloud({ categories: updatedCats, events: updatedEvts });
          };
          const startEditCategory = (category) => {
            setEditingColor(category.id);
            setEditLabel(category.label || '');
            setEditColorValue(category.color || '#000000');
          };
          const saveEditCategory = () => {
            if(!editLabel.trim()) return;
            const updatedCats = colorOptions.map(c => c.id === editingColor ? { ...c, label: editLabel, color: editColorValue } : c);
            saveToCloud({ categories: updatedCats });
            setEditingColor(null);
          };
          const cancelEditCategory = () => { setEditingColor(null); setEditLabel(''); setEditColorValue(''); };

          const safeEvents = Array.isArray(events) ? events : [];
          const safeColorOptions = Array.isArray(colorOptions) ? colorOptions : [];

          const currentViewEvents = safeEvents
              .map((e, index) => ({ ...e, _origIdx: index, _key: e.id || `legacy_${index}` }))
              .filter(e => e.month === month && e.year === year);
          const trelloExportEvents = trelloSingleEventKey
              ? currentViewEvents.filter(event => event._key === trelloSingleEventKey)
              : currentViewEvents;
          
          const getFilteredEvents = () => {
              if (calendarFilter === 'ALL') return currentViewEvents;
              if (statusPipeline[calendarFilter]) {
                  return currentViewEvents.filter(e => getEventStatus(e._origIdx) === calendarFilter);
              }
              return currentViewEvents.filter(e => e.color === calendarFilter);
          };

          const filteredViewEvents = getFilteredEvents();
          const getCalendarEventsForDay = (day) => filteredViewEvents.filter(e => e.day === day);

          const allIndexedEvents = safeEvents.map((event, index) => ({
              ...event,
              _origIdx: index,
              _key: event.id || `legacy_${index}`
          }));
          const getCalendarEventsForDate = (date) => {
              const dateEvents = allIndexedEvents.filter(event =>
                  Number(event.year) === date.getFullYear() &&
                  Number(event.month) === date.getMonth() &&
                  Number(event.day) === date.getDate()
              );
              if (calendarFilter === 'ALL') return dateEvents;
              if (statusPipeline[calendarFilter]) {
                  return dateEvents.filter(event => getEventStatus(event._origIdx) === calendarFilter);
              }
              return dateEvents.filter(event => event.color === calendarFilter);
          };
          const todayDate = new Date();
          const isSameDate = (first, second) =>
              first.getFullYear() === second.getFullYear() &&
              first.getMonth() === second.getMonth() &&
              first.getDate() === second.getDate();
          const activeDate = new Date(year, month, Math.min(selectedDay, getDaysInMonth(year, month)));
          const firstMonthDate = new Date(year, month, 1);
          const monthGridStart = new Date(year, month, 1 - ((firstMonthDate.getDay() + 6) % 7));
          const monthGridDates = Array.from({ length: 42 }, (_, index) => {
              const date = new Date(monthGridStart);
              date.setDate(monthGridStart.getDate() + index);
              return date;
          });
          const weekStart = new Date(activeDate);
          weekStart.setDate(activeDate.getDate() - ((activeDate.getDay() + 6) % 7));
          const weekDates = Array.from({ length: 7 }, (_, index) => {
              const date = new Date(weekStart);
              date.setDate(weekStart.getDate() + index);
              return date;
          });
          const scheduleHours = Array.from({ length: 14 }, (_, index) => index + 7);
          const weekDaysCompact = ['SEG', 'TER', 'QUA', 'QUI', 'SEX', 'SÁB', 'DOM'];
          const monthNamesDisplay = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
          const periodLabel = calendarView === 'day'
              ? `${activeDate.getDate()} de ${monthNamesDisplay[activeDate.getMonth()]} de ${activeDate.getFullYear()}`
              : calendarView === 'week'
                  ? `${weekDates[0].getDate()}–${weekDates[6].getDate()} de ${monthNamesDisplay[weekDates[6].getMonth()]} ${weekDates[6].getFullYear()}`
                  : `${monthNamesDisplay[month]} ${year}`;
          const selectCalendarDate = (date, prepareEvent = false) => {
              setYear(date.getFullYear());
              setMonth(date.getMonth());
              setSelectedDay(date.getDate());
              if (prepareEvent && isAdmin) {
                  setNewEvent(previous => ({
                      ...previous,
                      day: String(date.getDate()),
                      color: previous.color || safeColorOptions[0]?.id || ''
                  }));
                  window.setTimeout(() => document.querySelector('[data-tutorial="add-post"]')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
              }
          };

          const onDropToDate = (eventAction, targetDate, targetTime) => {
              if (isSelectionMode || !isAdmin) return;
              eventAction.preventDefault();
              const originalIndex = eventAction.dataTransfer.getData('eventIndex');
              if (originalIndex === null || originalIndex === '') return;
              const updatedEvents = [...events];
              const previousEvent = updatedEvents[originalIndex];
              let timeUpdate = {};
              if (targetTime !== undefined) {
                  if (!targetTime) {
                      timeUpdate = { startTime: '', endTime: '' };
                  } else {
                      const toMinutes = value => {
                          const [hoursPart, minutesPart] = String(value || '').split(':').map(Number);
                          return Number.isFinite(hoursPart) ? (hoursPart * 60) + (minutesPart || 0) : null;
                      };
                      const previousStart = toMinutes(previousEvent.startTime);
                      const previousEnd = toMinutes(previousEvent.endTime);
                      const duration = previousStart !== null && previousEnd !== null && previousEnd > previousStart ? previousEnd - previousStart : 60;
                      const targetStart = toMinutes(targetTime);
                      const targetEnd = Math.min((targetStart || 0) + duration, 1439);
                      timeUpdate = {
                          startTime: targetTime,
                          endTime: `${String(Math.floor(targetEnd / 60)).padStart(2, '0')}:${String(targetEnd % 60).padStart(2, '0')}`
                      };
                  }
              }
              updatedEvents[originalIndex] = {
                  ...previousEvent,
                  ...timeUpdate,
                  day: targetDate.getDate(),
                  month: targetDate.getMonth(),
                  year: targetDate.getFullYear(),
                  updatedBy: currentUserName,
                  updatedAt: new Date().toISOString()
              };
              saveToCloud({ events: updatedEvents });

              if (selectedCompany !== UPLI_GERAL_ID) {
                  const centralCalendar = companies.find(company => company.id === UPLI_GERAL_ID);
                  if (centralCalendar) {
                      const centralEvents = [...centralCalendar.events];
                      const linkedIndex = centralEvents.findIndex(item => item.id === previousEvent.id || item.id === `${previousEvent.id}_clone`);
                      if (linkedIndex !== -1) {
                          centralEvents[linkedIndex] = {
                              ...centralEvents[linkedIndex],
                              ...timeUpdate,
                              day: targetDate.getDate(),
                              month: targetDate.getMonth(),
                              year: targetDate.getFullYear()
                          };
                          db.collection('companies').doc(UPLI_GERAL_ID).set({ events: centralEvents }, { merge: true });
                      }
                  }
              }
          };
          const renderPrecisionEvent = (event, options = {}) => {
              const category = safeColorOptions.find(item => item.id === event.color);
              const eventColor = category?.color || '#2f5ea8';
              const status = getEventStatus(event._origIdx);
              const statusConfig = status && statusPipeline[status] ? statusPipeline[status] : null;
              const statusLabel = statusConfig?.label || 'Sem status';
              const isSelected = selectedEvents.includes(event._key);
              const eventTime = event.startTime
                  ? `${event.startTime}${event.endTime ? `–${event.endTime}` : ''}`
                  : 'Dia inteiro';
              const displayTitle = getCleanDisplayText(event.text, isCentral, category?.label);
              return (
                  <button
                      key={event._key}
                      type="button"
                      className={`precision-event ${isSelected ? 'ring-2 ring-offset-1 ring-slate-900' : ''}`}
                      style={{
                          '--event-color': eventColor,
                          '--status-color': statusConfig?.bg || '#98a8b8',
                          '--status-text': statusConfig?.text || '#17212b'
                      }}
                      draggable={isAdmin && !isSelectionMode}
                      onDragStart={eventAction => onDragStart(eventAction, event._origIdx)}
                      onClick={eventAction => {
                          eventAction.stopPropagation();
                          if (isSelectionMode) toggleEventSelection(event._key);
                          else startEditEvent(event, event._origIdx);
                      }}
                      aria-label={`${eventTime}: ${displayTitle}. ${category?.label || 'Sem categoria'}. ${statusLabel}. Responsável: ${event.responsible || 'não definido'}`}
                  >
                      <span className="precision-event-kicker">
                          <span className="precision-event-dot" aria-hidden="true"></span>
                          <span className="precision-event-category">{category?.label || 'Sem categoria'}</span>
                          <span className="precision-event-status">{statusLabel}</span>
                      </span>
                      {!options.hideTime && <span className="precision-event-time">{eventTime}</span>}
                      <span className="precision-event-title">{displayTitle}</span>
                      <span className="precision-event-meta">Resp. {event.responsible || 'não definido'}</span>
                  </button>
              );
          };

          const handleSelectionToggle = () => {
              setIsSelectionMode(!isSelectionMode);
              setSelectedEvents([]);
          };

          const toggleEventSelection = (eventKey) => {
              if (selectedEvents.includes(eventKey)) setSelectedEvents(selectedEvents.filter(key => key !== eventKey));
              else setSelectedEvents([...selectedEvents, eventKey]);
          };

          const toggleCategorySelection = (categoryId) => {
              const catEvents = currentViewEvents.filter(e => e.color === categoryId);
              const eventKeys = catEvents.map(e => e._key);
              if (eventKeys.length === 0) return;

              const allSelected = eventKeys.every(key => selectedEvents.includes(key));
              if (allSelected) {
                  setSelectedEvents(prev => prev.filter(key => !eventKeys.includes(key)));
              } else {
                  setSelectedEvents(prev => {
                      const newSelected = [...prev];
                      eventKeys.forEach(key => { if (!newSelected.includes(key)) newSelected.push(key); });
                      return newSelected;
                  });
              }
          };

          const exportSelectedToTXT = () => {
              const comp = companies.find(c => c.id === selectedCompany);
              if (!comp) return;

              let textContent = `Empresa ; Categoria ; Dia ; Título ; Status ; Anotações ; Responsável\n`;
              const eventsToExport = currentViewEvents.filter(e => selectedEvents.includes(e._key));

              eventsToExport.forEach(e => {
                  const cat = safeColorOptions.find(c => c.id === e.color);
                  const catName = cat ? cat.label : 'Sem Categoria';
                  const statusName = e.status && statusPipeline[e.status] ? statusPipeline[e.status].label : '';
                  const cleanNotes = e.notes ? e.notes.replace(/\n/g, ' ') : '';
                  const cleanResponsible = e.responsible ? e.responsible.replace(/[;\n]/g, ' ').trim() : '';
                  
                  let rawTitle = e.text;
                  const catPrefix = catName.toLowerCase() + ':';
                  if (rawTitle.toLowerCase().startsWith(catPrefix)) {
                      rawTitle = rawTitle.substring(catPrefix.length).trim();
                  }
                  
                  textContent += `${comp.name} ; ${catName} ; ${e.day} ; ${rawTitle} ; ${statusName} ; ${cleanNotes} ; ${cleanResponsible}\n`;
              });

              const blob = new Blob([textContent], { type: 'text/plain;charset=utf-8' });
              const url = URL.createObjectURL(blob);
              const link = document.createElement('a');
              link.href = url;
              link.download = `Export_${comp.name}_${selectedEvents.length}_posts.txt`;
              link.click();
              URL.revokeObjectURL(url);

              setIsSelectionMode(false);
              setSelectedEvents([]);
          };

          const getTrelloErrorMessage = (error) => {
              if (!error) return 'Erro desconhecido do Trello.';
              if (typeof error === 'string') return error;
              return error.responseText || error.message || error.statusText || 'Não foi possível concluir a operação.';
          };

          const trelloRequest = (path, options = {}) => {
              const { method = 'GET', params = {}, body = null } = options;
              return new Promise((resolve, reject) => {
                  if (!window.Trello || typeof window.Trello.rest !== 'function') {
                      reject(new Error('A biblioteca do Trello não carregou. Atualize a página e tente novamente.'));
                      return;
                  }

                  const cleanPath = path.replace(/^\/+/, '');
                  const requestParams = body !== null ? { ...params, ...body } : params;
                  window.Trello.rest(
                      method,
                      cleanPath,
                      requestParams,
                      response => resolve(response),
                      error => reject(new Error(getTrelloErrorMessage(error)))
                  );
              });
          };

          const loadTrelloListsForBoard = async (boardId) => {
              if (!boardId) return [];
              if (Array.isArray(trelloListsByBoard[boardId])) return trelloListsByBoard[boardId];

              const listsResponse = await trelloRequest(`/boards/${encodeURIComponent(boardId)}/lists`, {
                  params: { filter: 'open', fields: 'name,pos' }
              });
              const loadedLists = Array.isArray(listsResponse) ? listsResponse : [];
              setTrelloListsByBoard(previous => ({ ...previous, [boardId]: loadedLists }));
              return loadedLists;
          };

          const loadTrelloBoard = async (boardId, applyToEvents = true) => {
              if (!boardId) {
                  setTrelloLists([]);
                  setTrelloCards([]);
                  return;
              }

              const safeBoardId = encodeURIComponent(boardId);
              const [listsResponse, cardsResponse] = await Promise.all([
                  trelloRequest(`/boards/${safeBoardId}/lists`, {
                      params: { filter: 'open', fields: 'name,pos' }
                  }),
                  trelloRequest(`/boards/${safeBoardId}/cards/all`, {
                      params: { fields: 'name,desc,due,dueComplete,idList,url,closed' }
                  })
              ]);

              const loadedLists = Array.isArray(listsResponse) ? listsResponse : [];
              const loadedCards = Array.isArray(cardsResponse) ? cardsResponse : [];
              setTrelloLists(loadedLists);
              setTrelloListsByBoard(previous => ({ ...previous, [boardId]: loadedLists }));
              setTrelloCards(loadedCards);
              setTrelloDeleteSelection([]);

              const firstListId = loadedLists[0]?.id || '';
              setTrelloDefaultListId(firstListId);
              if (applyToEvents) {
                  setTrelloEventLists(
                      Object.fromEntries(trelloEventSelection.map(eventKey => [eventKey, firstListId]))
                  );
                  if (selectedCompany === UPLI_GERAL_ID) {
                      setTrelloEventBoards(
                          Object.fromEntries(trelloEventSelection.map(eventKey => [eventKey, boardId]))
                      );
                  }
              }
          };

          const loadConnectedTrelloAccount = async () => {
              const [member, boardsResponse] = await Promise.all([
                      trelloRequest('/members/me', {
                          params: { fields: 'fullName,username' }
                      }),
                      trelloRequest('/members/me/boards', {
                          params: { filter: 'open', fields: 'name,url' }
                      })
              ]);

              const loadedBoards = Array.isArray(boardsResponse) ? boardsResponse : [];
              setTrelloMember(member);
              setTrelloBoards(loadedBoards);

              if (loadedBoards.length === 0) {
                  setTrelloBoardId('');
                  setTrelloLists([]);
                  setTrelloCards([]);
                  throw new Error('A conta conectada não possui quadros abertos.');
              }

              const boardId = loadedBoards.some(board => board.id === trelloBoardId)
                  ? trelloBoardId
                  : loadedBoards[0].id;
              setTrelloBoardId(boardId);
              setTrelloProgress('Carregando listas e cartões...');
              await loadTrelloBoard(boardId);
          };

          const connectTrello = () => {
              setTrelloError('');
              setTrelloSuccess('');

              if (!window.Trello || typeof window.Trello.authorize !== 'function') {
                  setTrelloError('A conexão do Trello não carregou. Atualize a página e tente novamente.');
                  return;
              }

              setTrelloBusy(true);
              setTrelloProgress('Aguardando sua autorização no Trello...');
              window.Trello.authorize({
                  type: 'popup',
                  name: 'Calendário UPLI',
                  persist: true,
                  interactive: true,
                  scope: { read: true, write: true, account: false },
                  expiration: '30days',
                  success: async () => {
                      try {
                          setTrelloProgress('Carregando sua conta do Trello...');
                          await loadConnectedTrelloAccount();
                          setTrelloProgress('');
                      } catch (error) {
                          setTrelloMember(null);
                          setTrelloError(`Não foi possível carregar a conta: ${error.message}`);
                          setTrelloProgress('');
                      } finally {
                          setTrelloBusy(false);
                      }
                  },
                  error: error => {
                      setTrelloMember(null);
                      setTrelloBusy(false);
                      setTrelloProgress('');
                      setTrelloError(`Autorização não concluída. ${getTrelloErrorMessage(error)} Verifique se o domínio do calendário está em Allowed Origins no Power-Up.`);
                  }
              });
          };

          const disconnectTrello = () => {
              try {
                  if (window.Trello && typeof window.Trello.deauthorize === 'function') window.Trello.deauthorize();
                  else {
                      if (window.Trello && typeof window.Trello.setToken === 'function') window.Trello.setToken(null);
                      localStorage.removeItem('trello_token');
                  }
              } catch (error) {}
              setTrelloMember(null);
              setTrelloBoards([]);
              setTrelloBoardId('');
              setTrelloLists([]);
              setTrelloListsByBoard({});
              setTrelloCards([]);
              setTrelloEventBoards({});
              setTrelloDeleteSelection([]);
              setTrelloProgress('');
              setTrelloError('');
              setTrelloSuccess('');
          };

          const openTrelloIntegration = (requestedEventKeys = null) => {
              const explicitSelection = Array.isArray(requestedEventKeys)
                  ? currentViewEvents
                      .filter(event => requestedEventKeys.includes(event._key))
                      .map(event => event._key)
                  : null;
              const initialSelection = explicitSelection || (
                  selectedEvents.length > 0
                      ? currentViewEvents.filter(event => selectedEvents.includes(event._key)).map(event => event._key)
                      : currentViewEvents.map(event => event._key)
              );
              const defaultList = trelloDefaultListId || trelloLists[0]?.id || '';

              setTrelloSingleEventKey(explicitSelection?.length === 1 ? explicitSelection[0] : '');
              setTrelloEventSelection(initialSelection);
              setTrelloEventBoards(Object.fromEntries(initialSelection.map(eventKey => [eventKey, trelloBoardId])));
              setTrelloEventLists(Object.fromEntries(initialSelection.map(eventKey => [eventKey, defaultList])));
              setTrelloDefaultCompleted(false);
              setTrelloEventCompleted(Object.fromEntries(initialSelection.map(eventKey => [eventKey, false])));
              setTrelloMode('add');
              setTrelloDeleteSelection([]);
              setTrelloDeleteConfirmation('');
              setTrelloError('');
              setTrelloSuccess('');
              setTrelloProgress('');
              setShowTrelloModal(true);
          };

          const openSingleEventInTrello = (eventIndex) => {
              const event = currentViewEvents.find(item => item._origIdx === eventIndex);
              if (!event) return alert('Não foi possível localizar esta demanda no mês atual.');
              setEditingEventIndex(null);
              openTrelloIntegration([event._key]);
          };

          const closeTrelloIntegration = () => {
              if (trelloBusy) return;
              setShowTrelloModal(false);
              setTrelloSingleEventKey('');
              setTrelloDeleteConfirmation('');
              setTrelloError('');
              setTrelloSuccess('');
              setTrelloProgress('');
          };

          const changeTrelloBoard = async (boardId) => {
              setTrelloBoardId(boardId);
              setTrelloBusy(true);
              setTrelloError('');
              setTrelloSuccess('');
              setTrelloProgress('Carregando listas e cartões do quadro...');
              try {
                  await loadTrelloBoard(boardId);
                  setTrelloProgress('');
              } catch (error) {
                  setTrelloLists([]);
                  setTrelloCards([]);
                  setTrelloProgress('');
                  setTrelloError(`Não foi possível carregar o quadro: ${error.message}`);
              } finally {
                  setTrelloBusy(false);
              }
          };

          const changeTrelloEventBoard = async (eventKey, boardId) => {
              setTrelloBusy(true);
              setTrelloError('');
              setTrelloSuccess('');
              setTrelloProgress('Carregando colunas do quadro escolhido...');
              try {
                  const lists = await loadTrelloListsForBoard(boardId);
                  setTrelloEventBoards(previous => ({ ...previous, [eventKey]: boardId }));
                  setTrelloEventLists(previous => ({
                      ...previous,
                      [eventKey]: lists[0]?.id || ''
                  }));
                  setTrelloProgress('');
              } catch (error) {
                  setTrelloProgress('');
                  setTrelloError(`Não foi possível carregar as colunas desse quadro: ${error.message}`);
              } finally {
                  setTrelloBusy(false);
              }
          };

          const toggleTrelloEvent = (eventKey) => {
              const eventBoardId = trelloEventBoards[eventKey] || trelloBoardId;
              const eventBoardLists = trelloListsByBoard[eventBoardId] || trelloLists;
              setTrelloEventSelection(previous => {
                  if (previous.includes(eventKey)) return previous.filter(key => key !== eventKey);
                  if (selectedCompany === UPLI_GERAL_ID && !trelloEventBoards[eventKey]) {
                      setTrelloEventBoards(current => ({
                          ...current,
                          [eventKey]: eventBoardId
                      }));
                  }
                  if (!trelloEventLists[eventKey]) {
                      setTrelloEventLists(current => ({
                          ...current,
                          [eventKey]: eventBoardId === trelloBoardId
                              ? trelloDefaultListId || eventBoardLists[0]?.id || ''
                              : eventBoardLists[0]?.id || ''
                      }));
                  }
                  if (trelloEventCompleted[eventKey] === undefined) {
                      setTrelloEventCompleted(current => ({
                          ...current,
                          [eventKey]: trelloDefaultCompleted
                      }));
                  }
                  return [...previous, eventKey];
              });
          };

          const applyDefaultTrelloList = (listId) => {
              setTrelloDefaultListId(listId);
              setTrelloEventLists(previous => {
                  const updated = { ...previous };
                  trelloEventSelection.forEach(eventKey => {
                      const eventBoardId = trelloEventBoards[eventKey] || trelloBoardId;
                      if (selectedCompany !== UPLI_GERAL_ID || eventBoardId === trelloBoardId) {
                          updated[eventKey] = listId;
                      }
                  });
                  return updated;
              });
          };

          const applyDefaultTrelloCompleted = (completed) => {
              setTrelloDefaultCompleted(completed);
              setTrelloEventCompleted(previous => {
                  const updated = { ...previous };
                  trelloEventSelection.forEach(eventKey => { updated[eventKey] = completed; });
                  return updated;
              });
          };

          const toggleTrelloCardDeletion = (cardId) => {
              setTrelloDeleteSelection(previous =>
                  previous.includes(cardId)
                      ? previous.filter(id => id !== cardId)
                      : [...previous, cardId]
              );
          };

          const buildTrelloCard = (event, listId, completed) => {

          const persistTrelloLink = async (event, card, boardId) => {

                      const snapshot = await transaction.get(ref);
                      if (!snapshot.exists) return;
                      const currentEvents = [...(snapshot.data().events || [])];
                      let changed = false;
                      const nextEvents = currentEvents.map(item => {
                          const sameDemand = canonicalId(item.id) === canonicalId(event.id);
                          const sameSource = companyId !== centralId || !item.sourceCompanyId || item.sourceCompanyId === sourceCompanyId;
                          if (!sameDemand || !sameSource) return item;
                          changed = true;

                      if (changed) transaction.update(ref, { events: nextEvents });

          const executeTrelloExport = async () => {

                  const listId = trelloEventLists[event._key];
                  const availableLists = isCentral ? (trelloListsByBoard[boardId] || []) : trelloLists;
                  return !boardId || !listId || !availableLists.some(list => list.id === listId);
              });
              if (eventWithInvalidDestination) {

              }

              if (!trelloSingleEventKey && trelloMode === 'replace' && trelloDeleteConfirmation.trim().toUpperCase() !== 'APAGAR TUDO') {

              const cardsToDelete = trelloSingleEventKey

                      : [];

              setTrelloBusy(true);

                  for (let index = 0; index < eventsToCreate.length; index++) {

                          await persistTrelloLink(event, createdCard, boardId);
                      } catch (creationError) {
                          for (const createdCard of createdCards) {
                              try {
                                  await trelloRequest(`/cards/${encodeURIComponent(createdCard.id)}`, { method: 'DELETE' });
                              } catch (rollbackError) {}
                          }
                          throw new Error(`A adição foi interrompida no post ${index + 1}. Nenhum cartão antigo foi apagado. ${creationError.message}`);
                      }
                  }

                  for (let index = 0; index < cardsToDelete.length; index++) {
                      const card = cardsToDelete[index];
                      setTrelloProgress(`Apagando cartão antigo ${index + 1} de ${cardsToDelete.length}...`);
                      try {
                          await trelloRequest(`/cards/${encodeURIComponent(card.id)}`, { method: 'DELETE' });
                      } catch (deletionError) {

                    let exactStatus = null;

                    else if(statusStr.includes('atrasado')) exactStatus = 'atrasado';
                    else if(statusStr.includes('publicado') || statusStr.includes('feito') || statusStr.includes('concluid')) exactStatus = 'publicado';

                    const eventId = Date.now().toString() + Math.random().toString(36).substr(2, 5);
                    const newEvent = {
                        id: eventId,

                        color: category.id,
                        notes: notes,
                        responsible: responsible,
                        status: exactStatus,
                        createdBy: `Importação TXT por: ${currentUserName}`,
                        createdAt: new Date().toISOString()
                    };

                    compData.events.push(newEvent);
                    importedCount++;

                    const isEvento = category.id === 'cat_evento' || finalCatName.toLowerCase().includes('evento');
                    
                    if (importTargetCompany !== UPLI_GERAL_ID && !isEvento && importToCentral) {

                            ...newEvent,

                if (importedCount === 0) {

                const batch = db.batch();
                Object.values(updatesNeeded).forEach(comp => {

                    batch.set(ref, {
                        name: comp.name,

                        categories: comp.categories,
                        statuses: comp.statuses || {}
                    }, { merge: true });
                });

                await batch.commit();
                alert(`✅ ${importedCount} posts importados com sucesso!`);

          const getLegendItems = () => {

              if (currentDayOfWeek === 7) { weeks.push(currentWeek); currentWeek = new Array(7).fill(null); currentDayOfWeek = 0; }
            }
            if (currentDayOfWeek > 0) weeks.push(currentWeek);
            return weeks;
          };

          const getLines = (ctx, text, maxWidth) => {

          };

          const drawCalendarToCanvas = () => {

                  });

                      }
                  }
                  
                  eventY += dynamicHeight + eventSpacing;
                });
                maxWeekHeight = Math.max(maxWeekHeight, eventY - currentY);
              });
              currentY += maxWeekHeight + 30; 
            });

            if (legendItems.length > 0) {
              currentY += 40; 
              ctx.fillStyle = '#607080'; ctx.font = 'bold 14px "Atkinson Hyperlegible", Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
              ctx.fillText('CATEGORIAS / EMPRESAS', padding, currentY);
              currentY += 30; 
              
              const itemsPerRow = 6; 
              const gap = 15;
              const itemWidth = (contentWidth - ((itemsPerRow - 1) * gap)) / itemsPerRow;
              
              legendItems.forEach((item, idx) => {
                const col = idx % itemsPerRow;
                const row = Math.floor(idx / itemsPerRow);
                const itemX = padding + (col * (itemWidth + gap)); 
                const itemY = currentY + (row * 50);
                
                ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.roundRect(itemX, itemY, itemWidth, 36, 3); ctx.fill();
                ctx.strokeStyle = '#CBD5DF'; ctx.lineWidth = 1; ctx.stroke();
                ctx.fillStyle = item.color || '#98A8B8'; ctx.beginPath(); ctx.arc(itemX + 17, itemY + 18, 6, 0, 2 * Math.PI); ctx.fill();
                ctx.fillStyle = '#17212B'; ctx.font = 'bold 13px "Atkinson Hyperlegible", Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'middle';
                let label = item.label || ''; while (ctx.measureText(label).width > itemWidth - 20 && label.length > 3) label = label.slice(0, -4) + '...';
                ctx.fillText(label, itemX + 31, itemY + 18);
              });
              currentY += (Math.ceil(legendItems.length / itemsPerRow) * 50) + 20;
            }

            if (isCentral) {
                currentY += 30;
                ctx.fillStyle = '#607080'; ctx.font = 'bold 14px "Atkinson Hyperlegible", Arial'; ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
                ctx.fillText('FLUXO DE PRODUÇÃO', padding, currentY);
                currentY += 30;
                
                const statusItemsPerRow = 7; 
                const gapStatus = 15;
                const statusItemWidth = (contentWidth - ((statusItemsPerRow - 1) * gapStatus)) / statusItemsPerRow;
                
                Object.entries(statusPipeline).forEach(([key, val], idx) => {
                    const col = idx % statusItemsPerRow;
                    const row = Math.floor(idx / statusItemsPerRow);
                    const itemX = padding + (col * (statusItemWidth + gapStatus)); 
                    const itemY = currentY + (row * 50);
                    
                    ctx.fillStyle = '#FFFFFF'; ctx.beginPath(); ctx.roundRect(itemX, itemY, statusItemWidth, 36, 3); ctx.fill();
                    ctx.strokeStyle = '#CBD5DF'; ctx.lineWidth = 1; ctx.stroke();
                    ctx.fillStyle = val.bg; ctx.fillRect(itemX, itemY, 5, 36);
                    ctx.fillStyle = '#17212B'; ctx.font = 'bold 11px "Atkinson Hyperlegible", Arial'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    let label = val.label || ''; while (ctx.measureText(label).width > statusItemWidth - 10 && label.length > 3) label = label.slice(0, -4) + '...';
                    ctx.fillText(label.toUpperCase(), itemX + (statusItemWidth / 2), itemY + 18);
                });
            }

            return { canvas, finalHeight, pdfLinks };
          };
