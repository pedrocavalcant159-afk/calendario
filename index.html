                        <div className="grid grid-cols-2 gap-2">
                            <label className="text-[10px] font-bold text-gray-500 dark:text-gray-400">INÍCIO
                                <input type="time" value={newEvent.startTime} onChange={e => setNewEvent({...newEvent, startTime: e.target.value})} className="mt-1 block w-full border-2 border-green-200 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm outline-none" />
                            </label>
                            <label className="text-[10px] font-bold text-gray-500 dark:text-gray-400">FIM
                                <input type="time" value={newEvent.endTime} onChange={e => setNewEvent({...newEvent, endTime: e.target.value})} className="mt-1 block w-full border-2 border-green-200 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 text-sm outline-none" />
                            </label>
                        </div>
                        <div>
                            <label className="block text-[10px] font-bold text-gray-500 dark:text-gray-400 mb-1">RESPONSÁVEL PELO POST</label>
                            <select value={responsibleFormValue(newEvent)} onChange={e => assignResponsible(newEvent, setNewEvent, e.target.value)} className="w-full border-2 border-green-200 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 outline-none">
                                <option value="">Sem responsável</option>
                                {activeTeamMembers.map(member => <option key={member.id} value={member.id}>{member.name} · {member.whatsappGroup || 'grupo não configurado'}</option>)}
                            </select>
                        </div>
                        
                        <textarea placeholder="Anotações / Roteiro..." value={newEvent.notes} onChange={e => setNewEvent({...newEvent, notes: e.target.value})} className="w-full border-2 border-green-200 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 outline-none text-sm h-12 resize-none"></textarea>
                        
                        <div className="bg-gray-50 dark:bg-gray-900 p-2 rounded-lg border-2 border-green-200 dark:border-gray-600 flex items-center gap-2">
                            <span className="text-xl">🔗</span>
                            <div className="flex-1">
                                <label className="block text-[10px] font-bold text-gray-500 dark:text-gray-400">Link da Imagem / Arte (Opcional)</label>
                                <input type="url" placeholder="Cole o link do Drive, Canva, etc..." value={newEvent.imageUrl} onChange={(e) => setNewEvent({...newEvent, imageUrl: e.target.value})} className="w-full text-xs text-gray-800 dark:text-white p-1 border-b outline-none bg-transparent dark:border-gray-600" />
                            </div>
                        </div>

                        {!isCentral && (
                            <label className="flex items-center gap-2 text-xs font-bold text-gray-600 dark:text-gray-300 cursor-pointer bg-blue-50 dark:bg-gray-900 p-2 rounded-lg border border-blue-100 dark:border-gray-600">
                                <input type="checkbox" checked={sendToUpliGeral} onChange={e => setSendToUpliGeral(e.target.checked)} className="w-4 h-4 cursor-pointer" />
                                Enviar cópia para o Calendário Central (UPLI Geral)
                            </label>
                        )}

                        <div className="flex flex-col sm:flex-row gap-2 mt-1">
                            <select value={newEvent.color} onChange={e => setNewEvent({...newEvent, color: e.target.value})} className="flex-1 border-2 border-green-200 dark:border-gray-600 dark:bg-gray-700 dark:text-white rounded-lg px-3 py-2 font-bold w-full outline-none">
                              <option value="">Escolher categoria...</option>
                              {safeColorOptions.map(c => <option key={c.id} value={c.id}>{c.label}</option>)}
                            </select>
                            <button onClick={addEvent} disabled={!newEvent.color || !newEvent.text || !newEvent.day} className="bg-green-600 disabled:bg-gray-400 text-white rounded-lg px-8 py-2 font-black w-full sm:w-auto shadow-md hover:bg-green-700 transition uppercase tracking-wide">Postar</button>
                        </div>
                      </div>
                    </div>
                  </div>
                </div>
                )}

                <div data-tutorial="calendar" className="precision-calendar">
                  <div className="precision-commandbar" data-tutorial="calendar-controls">
                      <div className="precision-brand">
                          <span className="precision-eyebrow">Agenda de precisão</span>
                          <div className="mt-1 font-bold text-lg text-slate-900 dark:text-white">
                              {companies.find(company => company.id === selectedCompany)?.name || 'Calendário'}
                              {companies.find(company => company.id === selectedCompany)?.isPrivate ? ' · privado' : ''}
                          </div>
                          <div className="text-xs text-slate-500 dark:text-slate-400 mt-1">
                              <span aria-hidden="true" style={{ color: automationPaused ? '#b45309' : '#2e6b57' }}>●</span>{' '}
                              {automationPaused ? 'Automação pausada' : 'Nuvem sincronizada'}
                          </div>
                      </div>

                      <div className="precision-period" aria-label="Navegação do calendário">
                          <button type="button" className="precision-icon-button" onClick={handlePrevMonth} aria-label="Período anterior">‹</button>
                          <h2 aria-live="polite">{periodLabel}</h2>
                          <button type="button" className="precision-icon-button" onClick={handleNextMonth} aria-label="Próximo período">›</button>
                      </div>

                      <div className="precision-command-actions" data-tutorial="calendar-actions">
                          <button type="button" className="precision-today" onClick={goToToday}>Hoje</button>
                          {isAdmin && (
                              <button type="button" className="precision-new-button" onClick={() => selectCalendarDate(activeDate, true)}>+ Novo evento</button>
                          )}
                      </div>
                  </div>

                  <div className={`precision-system-strip ${automationPaused ? 'paused' : ''}`} role="status">
                      <span className="precision-system-state">{automationPaused ? 'Automação pausada' : 'Automação ativa'}</span>
                      <span className="precision-system-detail">
                          {automationPaused
                              ? 'Relatórios e lembretes estão suspensos até a retomada.'
                              : 'Relatórios semanais e lembretes usam os eventos atuais deste calendário.'}
                      </span>
                  </div>

                  {isSelectionMode && (
                      <div className="flex flex-col md:flex-row items-start md:items-center justify-between gap-3 p-4 border-b border-slate-300 bg-indigo-50 dark:bg-slate-900">
                          <div>
                              <strong className="text-indigo-900 dark:text-indigo-200">Seleção ativa · {selectedEvents.length} eventos</strong>
                              <p className="text-xs text-indigo-700 dark:text-indigo-300">Escolha os eventos que deseja exportar ou remover.</p>
                          </div>
                          <div className="flex flex-wrap gap-2">
                              <button onClick={exportSelectedToTXT} disabled={!selectedEvents.length} className="px-3 py-2 border border-indigo-800 text-indigo-900 dark:text-indigo-200 text-xs font-bold disabled:opacity-40">Exportar TXT</button>
                              <button onClick={openTrelloIntegration} disabled={!selectedEvents.length} className="px-3 py-2 bg-sky-700 text-white text-xs font-bold disabled:opacity-40">Enviar ao Trello</button>
                              <button onClick={deleteSelectedEvents} disabled={!selectedEvents.length} className="px-3 py-2 bg-red-700 text-white text-xs font-bold disabled:opacity-40">Excluir</button>
                          </div>
                      </div>
                  )}

                  <div className="precision-body">
                      <aside className="precision-rail" aria-label="Controles de visualização e filtros">
                          <span className="precision-rail-label">Visualização</span>
                          <div className="precision-view-list">
                              {[
                                  ['month', 'Mês', '01'],
                                  ['week', 'Semana', '07'],
                                  ['day', 'Dia', '24h']
                              ].map(([view, label, marker]) => (
                                  <button
                                      key={view}
                                      type="button"
                                      className={`precision-view-button ${calendarView === view ? 'active' : ''}`}
                                      onClick={() => setCalendarView(view)}
                                      aria-pressed={calendarView === view}
                                  >
                                      {label}<span>{marker}</span>
                                  </button>
                              ))}
                          </div>

                          <span className="precision-rail-label">{isCentral ? 'Status' : 'Categorias'}</span>
                          <div className="precision-filter-list" data-tutorial={isCentral ? 'status-filters' : undefined}>
                              <button type="button" className={`precision-filter ${calendarFilter === 'ALL' ? 'active' : ''}`} onClick={() => setCalendarFilter('ALL')}>
                                  <span className="precision-filter-dot" style={{ background: '#17212b' }}></span>
                                  Todos
                                  <span className="precision-filter-count">{currentViewEvents.length}</span>
                              </button>
                              {(isCentral ? Object.entries(statusPipeline).map(([id, item]) => ({ id, label: item.label, color: item.bg })) : safeColorOptions).map(item => (
                                  <button key={item.id} type="button" className={`precision-filter ${calendarFilter === item.id ? 'active' : ''}`} onClick={() => setCalendarFilter(item.id)}>
                                      <span className="precision-filter-dot" style={{ background: item.color }}></span>
                                      <span className="truncate">{item.label}</span>
                                      <span className="precision-filter-count">
                                          {currentViewEvents.filter(event => isCentral ? getEventStatus(event._origIdx) === item.id : event.color === item.id).length}
                                      </span>
                                  </button>
                              ))}
                          </div>

                          {isAdmin && (
                              <div className="precision-filter-list precision-tools mt-8">
                                  <span className="precision-rail-label">Ferramentas</span>
                                  <button className="precision-filter" onClick={handleSelectionToggle}><span>□</span>{isSelectionMode ? 'Cancelar seleção' : 'Selecionar'}</button>
                                  <button className="precision-filter" onClick={() => setShowImportModal(true)}><span>↓</span>Importar arquivo</button>
                                  <button className="precision-filter" onClick={openTrelloIntegration}><span>↗</span>Enviar ao Trello</button>
                                  <button className="precision-filter" onClick={() => setShowAutomationModal(true)}><span>⚙</span>Automação</button>
                                  <button className="precision-filter text-red-700 dark:text-red-300" onClick={rescueUpliGeral}><span>↺</span>Recuperar central</button>
                              </div>
                          )}
                      </aside>

                      <main className="precision-stage">
                          {calendarView === 'month' && (
                              <>
                                  <div className="precision-weekdays" aria-hidden="true">
                                      {weekDaysCompact.map(dayName => <div key={dayName} className="precision-weekday">{dayName}</div>)}
                                  </div>
                                  <div className="precision-month-grid" role="grid" aria-label={`Calendário de ${periodLabel}`}>
                                      {monthGridDates.map(date => {
                                          const dateEvents = getCalendarEventsForDate(date);
                                          const outside = date.getMonth() !== month;
                                          const selected = isSameDate(date, activeDate);
                                          const dateIsToday = isSameDate(date, todayDate);
                                          return (
                                              <div
                                                  key={date.toISOString()}
                                                  role="gridcell"
                                                  tabIndex={selected ? 0 : -1}
                                                  className={`precision-day-cell ${outside ? 'outside' : ''} ${date.getDay() === 0 || date.getDay() === 6 ? 'weekend' : ''} ${selected ? 'selected' : ''}`}
                                                  onClick={() => selectCalendarDate(date)}
                                                  onDoubleClick={() => selectCalendarDate(date, true)}
                                                  onKeyDown={event => {
                                                      if (event.key === 'Enter' || event.key === ' ') selectCalendarDate(date, event.key === 'Enter' && isAdmin);
                                                  }}
                                                  onDragOver={onDragOver}
                                                  onDrop={event => onDropToDate(event, date)}
                                                  aria-label={`${date.getDate()} de ${monthNamesDisplay[date.getMonth()]}, ${dateEvents.length} eventos`}
                                              >
                                                  <div className="precision-day-head">
                                                      <span className={`precision-day-number ${dateIsToday ? 'today' : ''}`} aria-current={dateIsToday ? 'date' : undefined}>{date.getDate()}</span>
                                                      {dateEvents.length === 0 && !outside && <span className="precision-empty">+</span>}
                                                  </div>
                                                  <div className="precision-event-stack">
                                                      {dateEvents.slice(0, 3).map(event => renderPrecisionEvent(event, { hideTime: true }))}
                                                      {dateEvents.length > 3 && <span className="precision-more">+ {dateEvents.length - 3} eventos</span>}
                                                  </div>
                                              </div>
                                          );
                                      })}
                                  </div>
                                  <section className="precision-mobile-agenda" aria-label="Agenda do dia selecionado">
                                      <h3>{activeDate.getDate()} de {monthNamesDisplay[activeDate.getMonth()]} · {getCalendarEventsForDate(activeDate).length || 'nenhum'} evento{getCalendarEventsForDate(activeDate).length === 1 ? '' : 's'}</h3>
                                      {getCalendarEventsForDate(activeDate).length
                                          ? getCalendarEventsForDate(activeDate).map(event => renderPrecisionEvent(event, { showMeta: true }))
                                          : <button className="precision-new-button" onClick={() => selectCalendarDate(activeDate, true)}>Planejar este dia</button>}
                                  </section>
                              </>
                          )}

                          {calendarView === 'week' && (
                              <div className="precision-week-scroll">
                                  <div className="precision-week-grid" aria-label={`Semana de ${periodLabel}`}>
                                      <div className="precision-week-corner"><span className="precision-eyebrow">Horário</span></div>
                                      {weekDates.map((date, index) => (
                                          <button key={`head-${date.toISOString()}`} className="precision-week-date" onClick={() => selectCalendarDate(date)}>
                                              <span>{weekDaysCompact[index]}</span>
                                              <strong className={isSameDate(date, todayDate) ? 'today' : ''}>{date.getDate()}</strong>
                                          </button>
                                      ))}

                                      <div className="precision-week-time precision-week-all-day">DIA TODO</div>
                                      {weekDates.map(date => (
                                          <div key={`all-${date.toISOString()}`} className={`precision-week-slot precision-week-all-day ${isSameDate(date, todayDate) ? 'today-column' : ''}`} onDragOver={onDragOver} onDrop={event => onDropToDate(event, date, '')}>
                                              {getCalendarEventsForDate(date).filter(event => !event.startTime).map(event => renderPrecisionEvent(event, { hideTime: true }))}
                                          </div>
                                      ))}

                                      {scheduleHours.flatMap(hour => [
                                          <div key={`time-${hour}`} className="precision-week-time">{String(hour).padStart(2, '0')}:00</div>,
                                          ...weekDates.map(date => (
                                              <div key={`${date.toISOString()}-${hour}`} className={`precision-week-slot ${isSameDate(date, todayDate) ? 'today-column' : ''}`} onDragOver={onDragOver} onDrop={event => onDropToDate(event, date, `${String(hour).padStart(2, '0')}:00`)}>
                                                  {getCalendarEventsForDate(date).filter(event => event.startTime && parseInt(event.startTime, 10) === hour).map(event => renderPrecisionEvent(event))}
                                              </div>
                                          ))
                                      ])}
                                  </div>
                              </div>
                          )}

                          {calendarView === 'day' && (
                              <div className="precision-day-view" aria-label={`Agenda de ${periodLabel}`}>
                                  <header className="precision-day-banner">
                                      <div>
                                          <span className="precision-eyebrow">{activeDate.toLocaleDateString('pt-BR', { weekday: 'long' })}</span>
                                          <h3>{activeDate.getDate()} <span className="font-normal text-slate-400">/ {String(activeDate.getMonth() + 1).padStart(2, '0')}</span></h3>
                                      </div>
                                      <p>{getCalendarEventsForDate(activeDate).length} evento{getCalendarEventsForDate(activeDate).length === 1 ? '' : 's'}</p>
                                  </header>
                                  <div className="precision-day-hour">DIA TODO</div>
                                  <div className="precision-day-lane" onDragOver={onDragOver} onDrop={event => onDropToDate(event, activeDate, '')}>
                                      {getCalendarEventsForDate(activeDate).filter(event => !event.startTime).map(event => renderPrecisionEvent(event, { hideTime: true, showMeta: true }))}
                                  </div>
                                  {scheduleHours.flatMap(hour => [
                                      <div key={`day-time-${hour}`} className="precision-day-hour">{String(hour).padStart(2, '0')}:00</div>,
                                      <div key={`day-lane-${hour}`} className="precision-day-lane" onDragOver={onDragOver} onDrop={event => onDropToDate(event, activeDate, `${String(hour).padStart(2, '0')}:00`)} onDoubleClick={() => {
                                          setNewEvent(previous => ({ ...previous, day: String(activeDate.getDate()), startTime: `${String(hour).padStart(2, '0')}:00`, color: previous.color || safeColorOptions[0]?.id || '' }));
                                          if (isAdmin) window.setTimeout(() => document.querySelector('[data-tutorial="add-post"]')?.scrollIntoView({ behavior: 'smooth', block: 'center' }), 80);
                                      }}>
                                          {getCalendarEventsForDate(activeDate).filter(event => event.startTime && parseInt(event.startTime, 10) === hour).map(event => renderPrecisionEvent(event, { showMeta: true }))}
                                      </div>
                                  ])}
                              </div>
                          )}
                      </main>
                  </div>

                  <footer className="precision-legend" aria-label="Legendas do calendário">
                      <section>
                          <span className="precision-legend-title">Categorias / empresas</span>
                          <div className="precision-legend-items">
                              {getLegendItems().length > 0 ? getLegendItems().map(item => (
                                  <span key={item.id} className="precision-legend-item" style={{ '--legend-color': item.color || '#98a8b8' }}>
                                      {item.label}
                                  </span>
                              )) : <span className="precision-empty">Nenhuma categoria configurada</span>}
                          </div>
                      </section>
                      <section>
                          <span className="precision-legend-title">Fluxo de produção</span>
                          <div className="precision-legend-items">
                              {Object.entries(statusPipeline).map(([key, item]) => (
                                  <span key={key} className="precision-legend-item precision-flow-item" style={{ '--legend-color': item.bg }}>
                                      {item.label}
                                  </span>
                              ))}
                          </div>
                      </section>
                  </footer>
                </div>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        const linkParams = new URLSearchParams(window.location.search);
        const isPublicReminderLink = linkParams.has('reminder');
        const isStatusUpdateLink = linkParams.has('updateCompany') && linkParams.has('updateEvent');
        root.render(
            <ErrorBoundary>
                {isPublicReminderLink ? <PublicReminderUpdate /> : (isStatusUpdateLink ? <PostStatusUpdate /> : <CalendarCreator />)}
            </ErrorBoundary>
        );
    </script>
</body>
</html>
